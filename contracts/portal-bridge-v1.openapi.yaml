openapi: 3.1.0
info:
  title: MHServerEmu Portal Bridge
  version: '1.0.0'
servers:
  - url: /portal-bridge/v1
security:
  - portalHmac: []
paths:
  /capabilities:
    get:
      operationId: getCapabilities
      responses:
        '200':
          description: Bridge capabilities.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BridgeCapabilities'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /health:
    get:
      operationId: getHealth
      responses:
        '200':
          description: Bridge health.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BridgeHealth'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/register:
    post:
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: Emulator account registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmulatorAccount'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
  /auth/verify:
    post:
      operationId: verify
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyRequest'
      responses:
        '200':
          description: Emulator credentials verified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmulatorAccount'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '503':
          $ref: '#/components/responses/Unavailable'
components:
  securitySchemes:
    portalHmac:
      type: apiKey
      in: header
      name: X-Portal-Signature
      description: HMAC-SHA-256 signature over the canonical request. The BFF-provided HmacSigningHandler supplies all headers centrally; callers never provide them.
      x-required-headers:
        - X-Portal-Contract-Version
        - X-Portal-Timestamp
        - X-Portal-Nonce
        - X-Portal-Body-SHA256
        - X-Portal-Operation-Id
        - X-Portal-Key-Id
        - X-Portal-Signature
  responses:
    Unauthorized:
      description: Request authentication failed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: An account already exists for the email address or player name.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InvalidCredentials:
      description: Credentials are invalid.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unavailable:
      description: The emulator account service is unavailable.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    RegisterRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - playerName
        - password
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 320
          description: Normalized email address.
        playerName:
          type: string
          minLength: 1
          maxLength: 16
          description: Normalized player name.
        password:
          type: string
          minLength: 1
          maxLength: 256
          writeOnly: true
    VerifyRequest:
      type: object
      additionalProperties: false
      required:
        - identifier
        - password
      properties:
        identifier:
          type: string
          minLength: 1
          maxLength: 320
          description: Normalized email address or player name.
        password:
          type: string
          minLength: 1
          maxLength: 256
          writeOnly: true
    EmulatorAccount:
      type: object
      additionalProperties: false
      required:
        - emulatorAccountId
      properties:
        emulatorAccountId:
          type: string
          minLength: 1
    BridgeCapabilities:
      type: object
      additionalProperties: false
      required:
        - contractVersion
        - emulatorVersion
        - upstreamCommit
        - gameBuild
        - snapshotSchemaVersion
        - serverInstanceId
        - capabilities
      properties:
        contractVersion:
          type: string
          const: '1.0'
        emulatorVersion:
          type: string
          minLength: 1
        upstreamCommit:
          type: string
          pattern: '^[0-9a-f]{40}$'
        gameBuild:
          type: string
          minLength: 1
        snapshotSchemaVersion:
          type: integer
          minimum: 1
        serverInstanceId:
          type: string
          format: uuid
        capabilities:
          type: array
          uniqueItems: true
          items:
            type: string
            minLength: 1
    BridgeHealth:
      type: object
      additionalProperties: false
      required:
        - status
        - checkedAtUtc
        - services
      properties:
        status:
          $ref: '#/components/schemas/HealthStatus'
        checkedAtUtc:
          type: string
          format: date-time
        services:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/HealthStatus'
    HealthStatus:
      type: string
      enum:
        - healthy
        - degraded
        - unhealthy
    Problem:
      type: object
      additionalProperties: false
      required:
        - code
        - correlationId
      properties:
        code:
          type: string
        correlationId:
          type: string
          format: uuid
