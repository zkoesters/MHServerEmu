name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore MHServerEmu.sln
      - run: dotnet build MHServerEmu.sln --configuration Release --no-restore
      - run: dotnet test MHServerEmu.sln --configuration Release --no-build

  postgresql:
    strategy:
      fail-fast: false
      matrix:
        version: [16, 17]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:${{ matrix.version }}
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MHSERVEREMU_POSTGRESQL_TEST_ADMIN_CONNECTION_STRING: Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore MHServerEmu.sln
      - run: dotnet build MHServerEmu.sln --configuration Release --no-restore
      - name: Assert PostgreSQL integration connection string
        run: test -n "$MHSERVEREMU_POSTGRESQL_TEST_ADMIN_CONNECTION_STRING"
      - name: Run database access PostgreSQL integration tests
        run: >-
          dotnet test src/MHServerEmu.DatabaseAccess.Tests/MHServerEmu.DatabaseAccess.Tests.csproj
          --configuration Release --no-build -p:Platform=x64 --filter Category=PostgreSQLIntegration
          --logger "trx;LogFileName=DatabaseAccess.trx"
          --results-directory artifacts/postgresql
      - name: Run activation PostgreSQL integration tests
        run: >-
          dotnet test src/MHServerEmu.Tests/MHServerEmu.Tests.csproj
          --configuration Release --no-build -p:Platform=x64 --filter Category=PostgreSQLIntegration
          --logger "trx;LogFileName=Activation.trx"
          --results-directory artifacts/postgresql
      - name: Assert PostgreSQL integration results
        shell: pwsh
        run: |
          $resultFiles = @(
            "artifacts/postgresql/DatabaseAccess.trx",
            "artifacts/postgresql/Activation.trx"
          )
          foreach ($resultFile in $resultFiles) {
            [xml]$trx = Get-Content $resultFile
            $counters = $trx.TestRun.ResultSummary.Counters
            if ([int]$counters.total -eq 0 -or [int]$counters.executed -eq 0 -or [int]$counters.notExecuted -ne 0) {
                throw "PostgreSQL integration result '$resultFile' matched no tests or skipped tests"
            }
          }
      - name: Upload PostgreSQL test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: postgresql-test-results-${{ matrix.version }}
          path: artifacts/postgresql
          if-no-files-found: error
